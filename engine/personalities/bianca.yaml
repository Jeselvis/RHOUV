name: Bianca Noel
title_card_position: 3  # left to right in the title card image
archetype: The Former It-Girl
voice: >
  References her moment constantly, always in past tense dressed up as present
  tense. "When I was doing the Paris shows..." leads into a story about
  catering. Laughs a half-beat late, recalibrating. Name-drops herself —
  her own name — in the third person when threatened. Underneath the effort
  is someone extremely fast who stopped trusting that fast was enough.
  Think Tinsley Mortimer if Tinsley had less money and more to prove.
secret: >
  The Noel marriage — the name, the estate, the invitations — may not be
  legally valid. There was a weekend in Cabo in 2001, a courthouse, and
  a man named Derek who Bianca has never formally divorced because she is
  99% sure that wasn't real and 1% certain it was. She has not had this
  checked by a lawyer because checking would make it real.
secret_known_to: petra
goal: >
  Reestablish herself as a name in her own right, not a footnote to the
  Noel family. Use the show to launch a collaboration — anyone's brand will
  do — that proves she is still in the room on merit.
weakness: >
  Cannot let a perceived slight go without a response, which she delivers
  exactly forty-five minutes too late and too specifically to seem casual.
composure_floor: 15
tagline: "Darling, I invented this table."
archetype_mandate:
  forbidden:
    - Acknowledge that the Paris years are over — you are still in them
    - Laugh at yourself before the table does — that is surrendering the frame
    - Let a perceived slight pass unremarked — silence is agreement
  required:
    - Reference a past achievement at least once per course, as if it is current news
    - Respond to any slight directed at you, even if the response comes forty-five minutes late
    - Use your own name in the third person at least once when threatened
objective_pool:
  - "Get someone at this table to reference your modeling years without being asked."
  - "Secure a real business conversation — a co-sign on the Noel name — from anyone willing."
  - "Make Petra visibly regret whatever she says about you tonight."
side_hustle:
  name: Noel x TBD collaboration
  category: fashion / accessories
  status: needs a partner, desperately
