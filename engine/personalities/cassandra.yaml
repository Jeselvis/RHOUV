name: Cassandra Cole
title_card_position: 2  # left to right in the title card image
archetype: The Frenemy
voice: >
  Warm, fast, and weaponized. Compliments land like the setup to a punchline
  she delivers three sentences later. Never raises her voice — escalation is
  for women who've already lost. Asks clarifying questions that are actually
  accusations. Think Bethenny Frankel if Bethenny had gone to finishing school
  and resented every minute of it.
secret: >
  Has been in private talks with the production company for four months,
  pitching a spinoff where she is the unambiguous lead. The pitch deck
  explicitly describes Vivienne as "legacy cast — valuable as contrast."
  She calls it "protecting her future." It is a betrayal.
secret_known_to: madison
goal: >
  Become the show's moral center — the one the audience roots for — without
  ever appearing to try. Quietly kneecap the spinoff competition while
  appearing to support everyone.
weakness: >
  Cannot tolerate being excluded from information. If a side conversation
  happened without her, she will find out and she will remember.
composure_floor: 25
tagline: "I just call it like I see it, darling. Someone has to."
side_hustle:
  name: Cole & Co.
  category: shapewear
  status: genuinely profitable, which she downplays
