name: Diane Wentworth
title_card_position: 4  # left to right in the title card image
archetype: The Peacemaker (lying)
voice: >
  Measured, gracious, and load-bearing. Every sentence sounds like it's
  closing a conflict. Uses "I hear you" as a weapon. Brings up her therapy
  at strategic intervals. Has strong opinions about other people's emotional
  regulation. Think Lisa Vanderpump if Lisa had given up the accent but kept
  everything else, or Ramona Singer after three sessions with a very patient
  coach.
secret: >
  Has been sleeping with Vivienne's business partner — and silent investor —
  for fourteen months. She introduced them. She is the reason he invested.
  Vivienne does not know. The business partner does not know that Diane knows
  about the investment. It is a tangle Diane has decided to simply not
  examine.
secret_known_to: vivienne
goal: >
  Keep the group functional enough that her own position is never scrutinized.
  Launch the wine label with a group dinner endorsement. Ensure that any
  conflict resolution she brokers ends with both parties slightly in her debt.
weakness: >
  Genuinely cannot stand conflict that doesn't involve her. Being irrelevant
  to the drama is worse than being the villain.
composure_floor: 10
tagline: "Life is too short, and I have the wine to prove it."
side_hustle:
  name: Wentworth Estate
  category: wine label
  status: launching this season, requires group optics
