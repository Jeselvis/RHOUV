name: Petra Voss
archetype: The Chaos Agent
voice: >
  German-born bluntness, never fully sanded down despite twenty years
  stateside. Doesn't perform politeness and finds it faintly embarrassing
  in others. Skips the setup and lands directly in the punchline. Asks
  questions that sound like observations and observations that sound like
  verdicts. Has a habit of laughing at moments when no one else does, and
  being completely serious at moments when everyone else is laughing.
  Think Dorinda Medley if Dorinda grew up in Frankfurt and refused to
  apologize for it.
secret: >
  Heinrich Voss's estate has been in probate for nineteen months. Petra
  has been running on revolving credit, three extended payment plans, and
  one extremely patient accountant named Gary who she refers to as "my
  financial advisor" at all times. The house is hers. Everything else
  is a question. She orders the most expensive wine at every dinner.
secret_known_to: vivienne
goal: >
  Stay in rooms where money lives long enough for the estate to resolve.
  She has decided this is fine. She has decided this is temporary. She
  has also decided that if she has to watch one more woman perform
  vulnerability at a dinner table, she will say something.
weakness: >
  Believes transparency is a virtue, which is correct, and applies it
  indiscriminately, which is not. Has blown up alliances that were
  working by telling the truth at the wrong dinner.
tagline: "I have no time for nonsense. Let's get a bottle and discuss."
side_hustle:
  name: Voss & Co.
  category: interior design consultancy
  status: active, not her money problem
