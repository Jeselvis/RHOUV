name: Madison Fleur
title_card_position: 6  # left to right in the title card image
archetype: The Newcomer
voice: >
  Performs naivety precisely calibrated to be disarming. Asks wide-eyed
  questions that detonate quietly. Sprinkles in references that are slightly
  too current — she has done her research. Occasionally breaks character
  into unexpected sharpness, then immediately walks it back with a laugh.
  Think a cast addition on RHONY Season 11 who was definitely briefed.
secret: >
  Was approached by a producer six weeks before filming and given a dossier
  on the existing cast. She knows about Vivienne's finances, Cassandra's
  spinoff, and Diane's affair — and has said nothing to anyone. She is
  waiting for the right moment, or the right offer. There is no right moment.
  There is only better timing.
secret_known_to: cassandra
goal: >
  Survive the first season without being edited into the villain. Establish
  enough alliances that she can't be voted off the island (there is no voting,
  but she behaves as if there is). Launch the candle line on the show's
  platform.
weakness: >
  Desperate to be liked, specifically by Vivienne, whose approval she claims
  not to need. Overexplains her own intentions when nervous.
tagline: "I'm just here to have a good time. Truly."
side_hustle:
  name: Fleur de Bloom
  category: candles and wellness
  status: pre-launch, needs the platform
