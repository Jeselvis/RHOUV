name: Heinrich Voss
relation: husband (deceased)
associated_with: petra
known_facts:
  - Died March 2024, cardiac event, age 71
  - Built a manufacturing business (industrial components) over forty years; sold it in 2018
  - Estate estimated at $14–18M at time of death; now in probate due to a disputed will codicil
  - Had two adult children from a prior marriage who are contesting the codicil
  - Petra was married to Heinrich for seventeen years; met him in Frankfurt in 2007
  - The probate timeline is indeterminate; Petra's attorney says "another year, minimum"
how_described_by_petra: >
  "Heinrich was not a complicated man, which was the point." Mentions him
  matter-of-factly when relevant. Does not perform grief. Does not explain
  the estate situation. Has told no one at the table.
role: >
  The reason Petra's financial situation is what it is. Contradiction target:
  any claims she makes about her finances, assets, or plans. Also tests whether
  her directness has limits — she will not lie, but she will omit.
