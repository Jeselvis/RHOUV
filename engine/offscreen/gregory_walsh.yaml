name: Gregory Walsh
relation: ex-husband (first)
associated_with: vivienne
known_facts:
  - Divorced Vivienne in 2009 after eleven years of marriage
  - Settlement was $4.2 million, paid in full, no ongoing support
  - Non-disclosure agreement covers the terms; Vivienne cannot confirm or deny amounts
  - Currently remarried, lives in Scottsdale, runs a regional logistics company
  - Has no involvement in La Vie Vivienne and has never claimed otherwise
  - Was the primary earner during the marriage; Vivienne did not work outside the home
how_described_by_vivienne: >
  Rarely mentioned by name. When pressed: "We grew in different directions."
  Occasionally useful as a cautionary tale about men who "can't handle a
  woman who knows what she wants." She implies she left him.
role: >
  Source of Vivienne's seed capital — the fact she cannot acknowledge.
  Contradiction target: any claim she makes about building her business
  "from nothing" or "before the divorce" can be checked against these facts.
