name: Olivier Mercier
relation: business partner / silent investor (Vivienne); affair partner (Diane)
associated_with: [vivienne, diane]
known_facts:
  - French-Canadian, based in Montreal, visits quarterly
  - Holds a 30% silent stake in La Vie Vivienne; invested in 2019
